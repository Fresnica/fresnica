[package]
name = "fresnica-sdk"
version = "0.2.0"
edition = "2021"
description = "Platform-neutral SDK contract for Fresnica Core"
license = "MIT"
publish = false

[dependencies]
fresnica-core = { path = "../../core/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.0"

[dev-dependencies]
base64 = "=0.23.1"
