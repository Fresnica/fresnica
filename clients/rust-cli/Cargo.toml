[package]
name = "fresnica-cli"
version = "0.1.0"
edition = "2021"
description = "Native command-line client for the Fresnica Stellar wallet"
license = "MIT"
publish = false

[[bin]]
name = "fresnica"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
fresnica-core = { path = "../../core/rust" }
fresnica-sdk = { path = "../../sdk/rust" }
rpassword = "=7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
stellar-xdr = "=28.0.0"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
ureq = { version = "=3.4.0", features = ["json"] }
zeroize = "=1.9.0"
