[package]
name = "fresnica-client"
version = "0.1.0"
edition = "2021"
description = "Reusable Rust application client and wallet services for Fresnica engineering clients"
license = "MIT"
publish = false

[dependencies]
fresnica-core = { path = "../../core/rust" }
fresnica-sdk = { path = "../../sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
ureq = { version = "=3.4.0", features = ["json", "multipart"] }
zeroize = "=1.9.0"
