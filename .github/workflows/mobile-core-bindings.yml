name: Mobile Core bindings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bindings/mobile/Cargo.toml"
      - "bindings/mobile/src/**"
      - "bindings/mobile/uniffi.toml"
      - "bindings/mobile/uniffi-bindgen.rs"
      - "sdk/rust/**"
      - "core/rust/**"
      - "spec/test-vectors/**"
      - ".github/workflows/mobile-core-bindings.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format mobile facade
        run: cargo fmt -- --check
        working-directory: bindings/mobile
      - name: Test Rust Core
        run: cargo test --manifest-path core/rust/Cargo.toml
      - name: Test universal SDK
        run: cargo test --manifest-path sdk/rust/Cargo.toml
      - name: Test mobile facade
        run: cargo test
        working-directory: bindings/mobile
      - name: Build UniFFI host library
        run: cargo build
        working-directory: bindings/mobile
      - name: Generate Kotlin bindings
        run: |
          rm -rf target/generated/kotlin
          cargo run --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libfresnica_mobile_core.so \
            --language kotlin --out-dir target/generated/kotlin
          grep -R "package com.fresnica.core" target/generated/kotlin
          grep -R "MobileCoreApi" target/generated/kotlin
          grep -R "MobileCoreError" target/generated/kotlin
          grep -R "prepareEd25519Signing" target/generated/kotlin
          grep -R "applyEd25519Signature" target/generated/kotlin
        working-directory: bindings/mobile
      - name: Generate Swift bindings
        run: |
          rm -rf target/generated/swift
          cargo run --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libfresnica_mobile_core.so \
            --language swift --out-dir target/generated/swift
          grep -R "MobileCoreApi" target/generated/swift
          grep -R "MobileCoreError" target/generated/swift
          grep -R "prepareEd25519Signing" target/generated/swift
          grep -R "applyEd25519Signature" target/generated/swift
        working-directory: bindings/mobile
