name: Temporary Process v2 Relay

on:
  push:
    branches:
      - "tmp/process-v2-relay-20260901"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact Process v2 patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fxq 'version = "0.2.0"' bindings/process/Cargo.toml; then
            echo "Process v2 source is already applied; verification-only pass."
          else
            test "$(sha256sum .ci/process-v2.patch.gz.b64 | awk '{print $1}')" = "99fab22001c4e9728fab6291ae491f34f4ef348a7ed47cffb07725c9d09401ad"
            base64 -d .ci/process-v2.patch.gz.b64 | gzip -d > /tmp/process-v2.patch
            test "$(sha256sum /tmp/process-v2.patch | awk '{print $1}')" = "997e2260bf7ca2e6d25649b719337a4e231718ca229224730166adfb236da6cf"
            git apply --check --recount /tmp/process-v2.patch
            git apply --recount /tmp/process-v2.patch
          fi
      - name: Assert exact source change set
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          cat > /tmp/expected <<'PATHS'
          bindings/process/Cargo.toml
          bindings/process/README.md
          bindings/process/src/main.rs
          docs/handoff.md
          docs/sdk/process-binding.md
          docs/tasks.md
          reference/python/fresnica/process_client.py
          reference/python/tests/test_process_client.py
          reference/python/tests/test_process_client_paths.py
          sdk/compatibility/manifest.json
          PATHS
          git diff --name-only | sort > /tmp/actual
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check
      - run: node sdk/compatibility/validate.mjs
      - run: cargo test --manifest-path sdk/rust/Cargo.toml
      - run: cargo test --manifest-path bindings/process/Cargo.toml
      - run: cargo build --release --manifest-path bindings/process/Cargo.toml --bin fresnica-process
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
        working-directory: reference/python
      - run: uv sync --locked
        working-directory: reference/python
      - name: Verify Process integration
        working-directory: reference/python
        env:
          FRESNICA_PROCESS_BIN: ${{ github.workspace }}/bindings/process/target/release/fresnica-process
        run: uv run pytest -q tests/test_process_binding_compat.py tests/test_process_client.py tests/test_process_client_paths.py
      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bindings/process/Cargo.toml \
            bindings/process/README.md \
            bindings/process/src/main.rs \
            docs/handoff.md \
            docs/sdk/process-binding.md \
            docs/tasks.md \
            reference/python/fresnica/process_client.py \
            reference/python/tests/test_process_client.py \
            reference/python/tests/test_process_client_paths.py \
            sdk/compatibility/manifest.json
          git diff --cached --check
          git commit -m "feat(process): transport Soroban authorization"
          git push origin HEAD:tmp/process-v2-relay-20260901
