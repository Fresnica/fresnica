name: Anchor history temporary

on:
  push:
    branches:
      - codex/anchor-history-boundaries

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anchor-history-boundaries
      - name: Apply architecture patch
        run: python tools/anchor_history_patch.py
      - name: Diff check
        run: git diff --check
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install Python
        working-directory: reference/python
        run: uv python install 3.11
      - name: Sync
        working-directory: reference/python
        run: uv sync --locked
      - name: Test
        working-directory: reference/python
        run: uv run pytest -q
      - name: Commit tested implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/fresnica reference/python/tests
          git commit -m "Separate anchor workflow and bound history catch-up"
          git push origin HEAD:codex/anchor-history-boundaries
