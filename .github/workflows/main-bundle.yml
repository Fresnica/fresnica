name: Main bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: main-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create verified main bundle
        run: |
          set -euo pipefail

          # Make the bundle self-contained and cloneable with main as its
          # default branch even if Actions checked out the push detached.
          git update-ref refs/heads/main "$GITHUB_SHA"
          git bundle create fresnica-main.bundle HEAD refs/heads/main
          git bundle verify fresnica-main.bundle

          bundled_main="$(git bundle list-heads fresnica-main.bundle refs/heads/main | awk '{print $1}')"
          test "$bundled_main" = "$GITHUB_SHA"

          verify_dir="$(mktemp -d)"
          git clone fresnica-main.bundle "$verify_dir/repo"
          test "$(git -C "$verify_dir/repo" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$verify_dir/repo" branch --show-current)" = "main"
          test -z "$(git -C "$verify_dir/repo" status --porcelain)"

      - name: Upload main bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fresnica-main-bundle
          path: fresnica-main.bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish bundle locator
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          BUNDLE_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_ARTIFACT_ID"
          test -n "$BUNDLE_ARTIFACT_URL"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=main-bundle \
            -f description="artifact-id=${BUNDLE_ARTIFACT_ID}; run-id=${GITHUB_RUN_ID}" \
            -f target_url="$BUNDLE_ARTIFACT_URL"
