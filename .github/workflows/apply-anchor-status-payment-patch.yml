name: Apply anchor status payment patch

on:
  push:
    branches:
      - dev/anchor-status-payment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/anchor-status-payment
          fetch-depth: 0

      - name: Apply staged source patch
        run: |
          set -euo pipefail
          cat .ci/anchor-status-payment.patch.gz.b64.part* > /tmp/anchor-status-payment.patch.gz.b64
          test "$(wc -c < /tmp/anchor-status-payment.patch.gz.b64)" -eq 14436
          echo "28ecc7815e3ca484727023ab19991fa9c345b042533a07b862ed0bfc911de93f  /tmp/anchor-status-payment.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/anchor-status-payment.patch.gz.b64 > /tmp/anchor-status-payment.patch.gz
          gzip -dc /tmp/anchor-status-payment.patch.gz > /tmp/anchor-status-payment.patch
          test "$(wc -c < /tmp/anchor-status-payment.patch)" -eq 46581
          echo "a43c6f1cfd7039945716fddde7bfeb6c8e11c180d6e5f5c6c971df250b0e9481  /tmp/anchor-status-payment.patch" | sha256sum -c -
          git apply --check /tmp/anchor-status-payment.patch
          git apply /tmp/anchor-status-payment.patch
          git diff --check
          bash clients/rust-cli/scripts/validate-sdk-boundary.sh

      - name: Commit source changes
        run: |
          set -euo pipefail
          rm -rf .ci
          rm -f .github/workflows/apply-anchor-status-payment-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Track anchor transfers and review withdrawal payments"
          git push origin HEAD:dev/anchor-status-payment
