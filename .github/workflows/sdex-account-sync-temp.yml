name: SDEX account sync temporary

on:
  push:
    branches:
      - codex/sdex-account-sync

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation
        shell: bash
        run: |
          if grep -q 'class AccountTradeSegmentSnapshot' reference/python/fresnica/dex_service.py; then
            echo 'implementation already applied'
          else
            python tools/sdex_account_sync_patch.py
          fi
      - name: Diff check
        run: git diff --check
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install Python
        working-directory: reference/python
        run: uv python install 3.11
      - name: Sync
        working-directory: reference/python
        run: uv sync --locked
      - name: Test
        working-directory: reference/python
        run: uv run pytest -q
      - name: Commit tested implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/fresnica reference/python/tests
          git commit -m "Complete SDEX account synchronization"
          git push origin HEAD:codex/sdex-account-sync
