name: React Native adapter

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "adapters/react-native/**"
      - "bindings/native/**"
      - "sdk/rust/**"
      - "core/rust/**"
      - "spec/test-vectors/**"
      - ".github/workflows/react-native-adapter.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Apple adapter build script syntax
        run: bash -n adapters/react-native/apple/build.sh
      - name: Test adapter contract and one-time build tooling
        run: npm test --prefix adapters/react-native

  native-sdk-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Native SDK source changes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=/tmp/fresnica-adapter-native-changes.txt
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > "$changed"
          cat "$changed"
          if grep -Eq '^(bindings/native/|sdk/rust/|core/rust/|spec/test-vectors/)' "$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        if: steps.source.outputs.changed == 'true'
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.changed == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.source.outputs.changed == 'true'
        with:
          gradle-version: "9.4.1"
      - name: Install Android compile platform
        if: steps.source.outputs.changed == 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;36.0.0"
      - name: Build compile-contract Native SDK AAR from pull-request source
        if: steps.source.outputs.changed == 'true'
        run: |
          rm -rf bindings/native/build/android/kotlin bindings/native/build/android/jniLibs
          mkdir -p bindings/native/build/android/kotlin
          cargo build --manifest-path bindings/native/Cargo.toml
          (
            cd bindings/native
            cargo run --features bindgen --bin uniffi-bindgen -- \
              generate --library target/debug/libfresnica_native_sdk.so \
              --language kotlin --out-dir build/android/kotlin
          )
          gradle -p bindings/native/platform/android assembleRelease --stacktrace
          AAR="$(find bindings/native/platform/android/build/outputs/aar -type f -name '*release.aar' -print -quit)"
          test -s "$AAR"
          cp "$AAR" /tmp/fresnica-native-sdk.aar
      - name: Download released Native SDK AAR
        if: steps.source.outputs.changed != 'true'
        run: |
          VERSION="$(node -p "require('./adapters/react-native/adapter-contract.json').fresnicaNativeSdkVersion")"
          curl --fail --location --retry 3 \
            "https://github.com/manran/fresnica/releases/download/native-sdk-v${VERSION}/fresnica-native-sdk-${VERSION}.aar" \
            --output /tmp/fresnica-native-sdk.aar
          test -s /tmp/fresnica-native-sdk.aar
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-aar-for-react-native-adapter
          path: /tmp/fresnica-native-sdk.aar
          if-no-files-found: error

  android-consumer-toolchain:
    needs: [contract, native-sdk-aar]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gradle-8-legacy-buildscript
            gradle: "8.11.1"
            agp: "8.9.2"
            kotlin: "1.9.24"
            plugin_style: "buildscript"
          - label: gradle-9-modern-plugins-dsl
            gradle: "9.4.1"
            agp: "9.2.1"
            kotlin: ""
            plugin_style: "plugins-dsl"
    env:
      GRADLE_VERSION: ${{ matrix.gradle }}
      AGP_VERSION: ${{ matrix.agp }}
      KOTLIN_VERSION: ${{ matrix.kotlin }}
      PLUGIN_STYLE: ${{ matrix.plugin_style }}
      RN_VERSION: "0.74.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: native-sdk-aar-for-react-native-adapter
          path: /tmp/fresnica-native-sdk-artifact
      - name: Use matched Native SDK AAR
        run: |
          cp /tmp/fresnica-native-sdk-artifact/fresnica-native-sdk.aar /tmp/fresnica-native-sdk.aar
          test -s /tmp/fresnica-native-sdk.aar
      - name: Create consumer-owned Android toolchain fixture
        run: |
          rm -rf /tmp/fresnica-consumer /tmp/fresnica-adapter-out
          mkdir -p /tmp/fresnica-consumer/android
          cat > /tmp/fresnica-consumer/package.json <<EOF_PACKAGE
          {"dependencies":{"react-native":"${RN_VERSION}"}}
          EOF_PACKAGE
          cat > /tmp/fresnica-consumer/android/gradle.properties <<'EOF_PROPERTIES'
          android.useAndroidX=true
          EOF_PROPERTIES

          if [ "$PLUGIN_STYLE" = "plugins-dsl" ]; then
            cat > /tmp/fresnica-consumer/android/settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'fresnica-consumer-fixture'
          EOF_SETTINGS
            cat > /tmp/fresnica-consumer/android/build.gradle <<EOF_GRADLE
          plugins {
              id 'com.android.library' version '${AGP_VERSION}' apply false
          }

          ext {
              compileSdkVersion = 35
          }
          EOF_GRADLE
          else
            cat > /tmp/fresnica-consumer/android/settings.gradle <<'EOF_SETTINGS'
          rootProject.name = 'fresnica-consumer-fixture'
          EOF_SETTINGS
            cat > /tmp/fresnica-consumer/android/build.gradle <<EOF_GRADLE
          buildscript {
              ext {
                  compileSdkVersion = 35
              }
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:${AGP_VERSION}"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_VERSION}"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_GRADLE
          fi

          gradle -p /tmp/fresnica-consumer/android wrapper --gradle-version "$GRADLE_VERSION"
      - name: Build adapter inside consumer Gradle environment
        run: |
          node adapters/react-native/tooling/fresnica-adapter.mjs \
            build react-native \
            --platform android \
            --project /tmp/fresnica-consumer \
            --native-android-aar /tmp/fresnica-native-sdk.aar \
            --out /tmp/fresnica-adapter-out
      - name: Validate consumer-built adapter
        run: |
          AAR=/tmp/fresnica-adapter-out/fresnica-rn-adapter.aar
          test -s "$AAR"
          unzip -p "$AAR" classes.jar > /tmp/fresnica-rn-adapter-classes.jar
          jar tf /tmp/fresnica-rn-adapter-classes.jar > /tmp/fresnica-rn-adapter-classes.txt
          grep -q 'com/fresnica/sdk/reactnative/FresnicaCoreModule.class' /tmp/fresnica-rn-adapter-classes.txt
          grep -q 'com/fresnica/sdk/reactnative/FresnicaCorePackage.class' /tmp/fresnica-rn-adapter-classes.txt
          node adapters/react-native/tooling/adapter-manifest.mjs check \
            --project /tmp/fresnica-consumer \
            --manifest /tmp/fresnica-adapter-out/adapter-manifest.json
