name: React Native adapter

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "adapters/react-native/**"
      - "bindings/native/Cargo.toml"
      - "bindings/native/src/**"
      - ".github/workflows/react-native-adapter.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Apple adapter build script syntax
        run: bash -n adapters/react-native/apple/build.sh
      - name: Test adapter contract and one-time build tooling
        run: npm test --prefix adapters/react-native
