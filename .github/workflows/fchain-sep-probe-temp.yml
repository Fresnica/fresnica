name: Fchain SEP probe temporary

on:
  push:
    branches:
      - codex/sep6-search-ux
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe stellar.toml and SEP-6 info
        shell: bash
        run: |
          set -euo pipefail
          echo '--- stellar.toml ---'
          curl -fsSL --max-time 10 https://fchain.io/.well-known/stellar.toml | tee /tmp/stellar.toml
          echo
          echo '--- endpoints ---'
          python - <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('/tmp/stellar.toml').read_text())
          for key in ('TRANSFER_SERVER','TRANSFER_SERVER_SEP0024','WEB_AUTH_ENDPOINT','KYC_SERVER','SIGNING_KEY'):
              print(f'{key}={data.get(key)}')
          print('XRP currency:', next((x for x in data.get('CURRENCIES',[]) if x.get('code') == 'XRP'), None))
          pathlib.Path('/tmp/sep6').write_text(str(data.get('TRANSFER_SERVER') or ''))
          PY
          SEP6=$(cat /tmp/sep6)
          if [ -n "$SEP6" ]; then
            echo
            echo '--- SEP-6 /info ---'
            curl -fsSL --max-time 10 "${SEP6%/}/info"
            echo
          fi
