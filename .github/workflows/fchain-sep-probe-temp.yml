name: SEP-6 search temporary

on:
  push:
    branches:
      - codex/sep6-search-ux
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation
        shell: bash
        run: |
          if grep -q 'class AnchorSep6Transfer' reference/python/fresnica/anchor_service.py; then
            echo 'implementation already applied'
          else
            python tools/sep6_search_patch.py
            python tools/sep6_search_patch_fixup.py
          fi
      - name: Diff check
        run: git diff --check
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install Python
        working-directory: reference/python
        run: uv python install 3.11
      - name: Sync
        working-directory: reference/python
        run: uv sync --locked
      - name: Test
        working-directory: reference/python
        run: uv run pytest -q
      - name: Commit tested implementation
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/fresnica reference/python/tests
          git commit -m "Add native SEP-6 transfers and slash search"
          git push origin HEAD:codex/sep6-search-ux
