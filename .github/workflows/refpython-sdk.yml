name: RefPython process binding validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "core/rust/**"
      - "sdk/rust/**"
      - "bindings/process/**"
      - "reference/python/fresnica/process_client.py"
      - "reference/python/fresnica/runtime.py"
      - "reference/python/tests/test_process_*.py"
      - ".github/workflows/refpython-sdk.yml"

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path sdk/rust/Cargo.toml
      - run: cargo test --manifest-path bindings/process/Cargo.toml
      - run: cargo build --release --manifest-path bindings/process/Cargo.toml --bin fresnica-process
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
        working-directory: reference/python
      - run: uv sync --locked
        working-directory: reference/python
      - run: uv run pytest -q tests/test_process_binding_compat.py tests/test_process_client.py tests/test_process_client_paths.py
        working-directory: reference/python
        env:
          FRESNICA_PROCESS_BIN: ${{ github.workspace }}/bindings/process/target/release/fresnica-process
