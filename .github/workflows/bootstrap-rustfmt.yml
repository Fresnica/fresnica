name: Bootstrap portable rustfmt

on:
  push:
    branches:
      - tooling/rustfmt-bootstrap-20260826

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Package GNU rustfmt with private runtime
        shell: bash
        run: |
          set -euxo pipefail
          SYSROOT="$(rustc --print sysroot)"
          RUSTFMT="$SYSROOT/bin/rustfmt"
          DRIVER="$(find "$SYSROOT/lib" -maxdepth 1 -name 'librustc_driver-*.so' -print -quit)"
          LLVM="$(find "$SYSROOT/lib" -maxdepth 1 -name 'libLLVM.so.*' -print -quit)"
          rustfmt --version
          ls -lh "$RUSTFMT" "$DRIVER" "$LLVM"
          mkdir -p portable-rustfmt/bin portable-rustfmt/lib
          cp "$RUSTFMT" portable-rustfmt/bin/rustfmt
          cp "$DRIVER" "$LLVM" portable-rustfmt/lib/
          printf '%s\n' 'rustfmt 1.9.0-stable / Rust 1.98.0 / Linux x86_64 GNU' > portable-rustfmt/VERSION.txt
          tar -czf portable-rustfmt-gnu-linux-x86_64.tar.gz portable-rustfmt
          ls -lh portable-rustfmt-gnu-linux-x86_64.tar.gz
      - name: Inspect MUSL host rustfmt
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          rustup toolchain install stable-x86_64-unknown-linux-musl --component rustfmt --profile minimal --no-self-update
          MUSL_RUSTFMT="$(rustup which --toolchain stable-x86_64-unknown-linux-musl rustfmt)"
          "$MUSL_RUSTFMT" --version
          file "$MUSL_RUSTFMT"
          ls -lh "$MUSL_RUSTFMT"
          ldd "$MUSL_RUSTFMT" || true
      - uses: actions/upload-artifact@v4
        with:
          name: portable-rustfmt-gnu-linux-x86_64
          path: portable-rustfmt-gnu-linux-x86_64.tar.gz
          retention-days: 30
