name: Classic Client Store Ownership Probe

on:
  push:
    branches: [verify/classic-client-store-ownership]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Classic client store ownership transform
        run: python3 .github/classic-client-store-transform.py
      - name: Format Rust
        run: cargo fmt --manifest-path reference/rust-client/Cargo.toml
      - name: Test Rust capability client
        run: cargo test --manifest-path reference/rust-client/Cargo.toml
      - name: Check Rust capability client
        run: cargo check --manifest-path reference/rust-client/Cargo.toml
      - name: Commit generated verifier state
        shell: bash
        run: |
          if git diff --quiet -- reference/rust-client/src; then
            echo "Verifier state already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/rust-client/src
          git commit -m "verify: capture Classic client store ownership"
          git push origin HEAD:verify/classic-client-store-ownership
