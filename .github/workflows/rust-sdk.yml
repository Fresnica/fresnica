name: Rust SDK

on:
  push:
    paths:
      - "sdk/rust/**"
      - "core/rust/**"
      - "spec/test-vectors/**"
      - ".github/workflows/rust-sdk.yml"
  pull_request:
    paths:
      - "sdk/rust/**"
      - "core/rust/**"
      - "spec/test-vectors/**"
      - ".github/workflows/rust-sdk.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check universal SDK formatting
        run: cargo fmt --manifest-path sdk/rust/Cargo.toml -- --check
      - name: Test Rust Core
        run: cargo test --manifest-path core/rust/Cargo.toml
      - name: Test universal SDK
        run: cargo test --manifest-path sdk/rust/Cargo.toml
