name: Rust core

on:
  push:
    paths:
      - "core/rust/**"
      - "reference/python/fresnica/manager.py"
      - "reference/python/fresnica/rust_core_client.py"
      - "reference/python/fresnica/signer.py"
      - "reference/python/tests/test_rust_core_client.py"
      - "spec/test-vectors/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "core/rust/**"
      - "reference/python/fresnica/manager.py"
      - "reference/python/fresnica/rust_core_client.py"
      - "reference/python/fresnica/signer.py"
      - "reference/python/tests/test_rust_core_client.py"
      - "spec/test-vectors/**"
      - ".github/workflows/rust-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path core/rust/Cargo.toml
      - run: cargo build --manifest-path core/rust/Cargo.toml --bin fresnica-core
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
        working-directory: reference/python
      - run: uv sync --locked
        working-directory: reference/python
      - run: uv run pytest -q tests/test_rust_core_client.py
        working-directory: reference/python
        env:
          FRESNICA_CORE_BIN: ${{ github.workspace }}/core/rust/target/debug/fresnica-core
