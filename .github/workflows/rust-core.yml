name: Rust core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/rust/**"
      - "spec/test-vectors/**"
      - ".github/workflows/rust-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path core/rust/Cargo.toml
