name: Apply anchor transfer execution patch

on:
  push:
    branches:
      - dev/anchor-transfer-execution

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/anchor-transfer-execution
          fetch-depth: 0

      - name: Apply staged source patch
        run: |
          set -euo pipefail
          head -c 12000 .ci/anchor-transfer.patch.part00 > /tmp/anchor-transfer.patch
          cat .ci/anchor-transfer.patch.part01 >> /tmp/anchor-transfer.patch
          cat .ci/anchor-transfer.patch.part02 >> /tmp/anchor-transfer.patch
          printf '\n' >> /tmp/anchor-transfer.patch
          test "$(wc -c < /tmp/anchor-transfer.patch)" -eq 32706
          git apply --check /tmp/anchor-transfer.patch
          git apply /tmp/anchor-transfer.patch
          git diff --check
          bash clients/rust-cli/scripts/validate-sdk-boundary.sh

      - name: Commit source changes
        run: |
          set -euo pipefail
          rm -rf .ci
          rm -f .github/workflows/apply-anchor-transfer-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start SEP-24 and SEP-6 anchor transfers"
          git push origin HEAD:dev/anchor-transfer-execution
