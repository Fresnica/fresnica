name: Validate SDEX services candidate

on:
  push:
    branches:
      - validation/sdex-services-20260826

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Reproduce formatted candidate tree
        shell: bash
        run: |
          cargo fmt --manifest-path clients/rust-client/Cargo.toml
          cargo fmt --manifest-path clients/rust-cli/Cargo.toml
          cargo fmt --manifest-path clients/rust-tui/Cargo.toml
          test "$(git diff --name-only)" = "clients/rust-client/src/dex.rs"
          git add clients/rust-client/src/dex.rs
          git rm --cached .github/workflows/validate-sdex-services.yml
          test "$(git write-tree)" = "cfe7ae0b197aa66c5c232dde373a809a5c0d10d7"
      - name: SDK boundary
        run: bash clients/rust-cli/scripts/validate-sdk-boundary.sh
      - name: Shared client tests
        run: cargo test --manifest-path clients/rust-client/Cargo.toml
      - name: Rust CLI tests
        run: cargo test --manifest-path clients/rust-cli/Cargo.toml
      - name: Rust TUI tests
        run: cargo test --manifest-path clients/rust-tui/Cargo.toml
      - name: Shared client release build
        run: cargo build --release --manifest-path clients/rust-client/Cargo.toml
      - name: Rust CLI release build
        run: cargo build --release --manifest-path clients/rust-cli/Cargo.toml --bin fresnica
      - name: Rust TUI release build
        run: cargo build --release --manifest-path clients/rust-tui/Cargo.toml
