name: Required CI

on: [workflow_dispatch, pull_request]

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: node sdk/compatibility/validate.mjs
      - run: bash scripts/validate-rust-sdk-boundary.sh
      - name: Detect affected Rust surfaces
        id: affected
        shell: bash
        run: |
          set -euo pipefail
          changed=/tmp/fresnica-changed-files.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > "$changed"
          else
            git ls-files > "$changed"
          fi
          cat "$changed"

          flag() {
            local name="$1"
            local pattern="$2"
            if grep -Eq "$pattern" "$changed"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          flag rust '(^|/)(Cargo\.toml|Cargo\.lock)$|\.rs$'
          flag core '^(core/rust/|spec/test-vectors/)'
          flag sdk '^(core/rust/|sdk/rust/|spec/test-vectors/)'
          flag process '^(core/rust/|sdk/rust/|bindings/process/|spec/test-vectors/)'
          flag rust_reference '^reference/rust-client/'
          flag native '^bindings/native/'
      - name: Check changed Rust formatting
        if: steps.affected.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rust_files < <(
            grep -E '\.rs$' /tmp/fresnica-changed-files.txt | while read -r file; do
              if [ -f "$file" ]; then
                printf '%s\n' "$file"
              fi
            done
          )
          if [ "${#rust_files[@]}" -gt 0 ]; then
            rustfmt --edition 2021 --config skip_children=true --check "${rust_files[@]}"
          fi
      - name: Test Rust Core
        if: steps.affected.outputs.core == 'true'
        run: cargo test --manifest-path core/rust/Cargo.toml
      - name: Test universal SDK
        if: steps.affected.outputs.sdk == 'true'
        run: cargo test --manifest-path sdk/rust/Cargo.toml
      - name: Test Process Binding
        if: steps.affected.outputs.process == 'true'
        run: cargo test --manifest-path bindings/process/Cargo.toml
      - name: Test Rust capability reference
        if: steps.affected.outputs.rust_reference == 'true'
        run: cargo test --manifest-path reference/rust-client/Cargo.toml
      - name: Test Native Binding host contract
        if: steps.affected.outputs.native == 'true'
        run: cargo test --manifest-path bindings/native/Cargo.toml
