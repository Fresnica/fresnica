name: DEX polish PR temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'codex/dex-presentation-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply focused DEX presentation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/dex-polish-temp.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'dex-polish-patch', 'exec'))
          PY
      - name: Diff check
        run: git diff --check
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install Python
        working-directory: reference/python
        run: uv python install 3.11
      - name: Sync
        working-directory: reference/python
        run: uv sync --locked
      - name: Test
        working-directory: reference/python
        run: uv run pytest -q
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/fresnica/tui/dex.py reference/python/tests/test_tui_dex.py reference/python/tests/test_tui_dex_market_ux.py
          git commit -m "Polish DEX market presentation"
          git push origin HEAD:${{ github.head_ref }}
