name: Security patch relay

# One-shot relay; retry after verified chunk correction.
on:
  push:
    branches:
      - security/xdr-passphrase-hardening
    paths:
      - ".github/workflows/security-patch-relay.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/xdr-passphrase-hardening
          fetch-depth: 0
      - name: Apply staged security patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/security-patch/part* | base64 -d > /tmp/security.patch
          git apply --check /tmp/security.patch
          git apply /tmp/security.patch
          rm -rf .github/security-patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden XDR decoding and passphrase policy"
          git push origin HEAD:security/xdr-passphrase-hardening
