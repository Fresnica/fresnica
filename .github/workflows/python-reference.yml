name: Python reference

on:
  push:
    paths:
      - "reference/python/**"
      - ".github/workflows/python-reference.yml"
  pull_request:
    paths:
      - "reference/python/**"
      - ".github/workflows/python-reference.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv lock
      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet || (git commit -m "Lock Python dependencies with uv" && git push)
      - run: uv sync --locked
      - run: uv run pytest -q
