name: Python reference

on:
  push:
    paths:
      - "reference/python/**"
      - ".github/workflows/python-reference.yml"
  pull_request:
    paths:
      - "reference/python/**"
      - ".github/workflows/python-reference.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv lock
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: reference/python/uv.lock
