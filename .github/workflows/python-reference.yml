name: Python reference

on:
  push:
    paths:
      - "reference/python/**"
      - ".github/workflows/python-reference.yml"
  pull_request:
    paths:
      - "reference/python/**"
      - ".github/workflows/python-reference.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: FRESNICA_LIVE_TESTNET=1 uv run pytest -q
