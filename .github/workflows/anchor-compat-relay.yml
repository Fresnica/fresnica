name: Anchor compatibility relay

on:
  push:
    branches:
      - compat/anchor-legacy-sep6

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat/anchor-legacy-sep6
          fetch-depth: 0
      - name: Apply Anchor compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .anchor-compat.patch
          git apply .anchor-compat.patch
          rm .anchor-compat.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve legacy SEP-6 type metadata"
          git push origin HEAD:compat/anchor-legacy-sep6
