name: Apply SEP-10 verifier patch

on:
  push:
    branches:
      - dev/sep10-challenge-verifier

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/sep10-challenge-verifier
          fetch-depth: 0
      - name: Apply staged source patch
        run: |
          git apply --check .ci/sep10-challenge-verifier.patch
          git apply .ci/sep10-challenge-verifier.patch
          rm .ci/sep10-challenge-verifier.patch
          rm .github/workflows/apply-sep10-verifier-patch.yml
          git diff --check
          bash clients/rust-cli/scripts/validate-sdk-boundary.sh
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify SEP-10 authentication challenges"
          git push origin HEAD:refs/heads/dev/sep10-challenge-verifier
