name: DEX polish temporary

on:
  push:
    branches:
      - codex/dex-presentation-polish

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused DEX presentation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path("reference/python/fresnica/tui/dex.py")
          text = path.read_text()

          text = replace_once(
              text,
              '''        Binding("r", "refresh", "Refresh"),\n        Binding("f", "favorite_market", "Star / Unstar"),''',
              '''        Binding("r", "refresh", "Refresh"),\n        Binding("u", "toggle_timezone", "UTC / Local"),\n        Binding("f", "favorite_market", "Star / Unstar"),''',
              "timezone binding",
          )

          text = replace_once(
              text,
              '''    DexScreen { layout: vertical; background: $surface; padding: 1 2; }''',
              '''    DexScreen { layout: vertical; width: 100%; height: 100%; background: $background; opacity: 100%; padding: 1 2; }''',
              "opaque dex screen",
          )

          text = replace_once(
              text,
              '''        with Horizontal(id="book-row"):\n            with Vertical(classes="book-pane"):\n                yield Label("ASK · SELL", classes="dex-section")\n                yield DataTable(id="dex-asks")\n            with Vertical(classes="book-pane"):\n                yield Label("BID · BUY", classes="dex-section")\n                yield DataTable(id="dex-bids")''',
              '''        with Horizontal(id="book-row"):\n            with Vertical(classes="book-pane"):\n                yield Label("BID · BUY", classes="dex-section")\n                yield DataTable(id="dex-bids")\n            with Vertical(classes="book-pane"):\n                yield Label("ASK · SELL", classes="dex-section")\n                yield DataTable(id="dex-asks")''',
              "book pane order",
          )

          text = replace_once(
              text,
              '''        asks = self.query_one("#dex-asks", DataTable)\n        asks.add_columns("Amount", "Price")\n        asks.cursor_type = "row"\n        bids = self.query_one("#dex-bids", DataTable)\n        bids.add_columns("Price", "Amount")\n        bids.cursor_type = "row"\n        trades = self.query_one("#dex-trades", DataTable)\n        trades.add_columns("Price", "Amount", "Time")\n        trades.cursor_type = "row"\n        offers = self.query_one("#dex-offers", DataTable)\n        offers.add_columns("Side", "Amount", "Price", "Total", "Offer ID")\n        offers.cursor_type = "row"\n        fills = self.query_one("#dex-fills", DataTable)\n        fills.add_columns("Time", "Side", "Amount", "Price", "Total", "Fills", "Offer")\n        fills.cursor_type = "row"''',
              '''        bids = self.query_one("#dex-bids", DataTable)\n        bids.add_columns("Amount", "Price")\n        bids.cursor_type = "row"\n        asks = self.query_one("#dex-asks", DataTable)\n        asks.add_columns("Price", "Amount")\n        asks.cursor_type = "row"\n        trades = self.query_one("#dex-trades", DataTable)\n        trades.add_columns("Price", "Amount", self._time_column())\n        trades.cursor_type = "row"\n        offers = self.query_one("#dex-offers", DataTable)\n        offers.add_columns("Side", "Amount", "Price", "Total", "Offer ID")\n        offers.cursor_type = "row"\n        fills = self.query_one("#dex-fills", DataTable)\n        fills.add_columns(self._time_column(), "Side", "Amount", "Price", "Total", "Fills", "Offer")\n        fills.cursor_type = "row"''',
              "book and time columns",
          )

          text = replace_once(
              text,
              '''    def action_refresh(self) -> None:\n        self.refresh_market()\n\n    def action_favorite_market(self) -> None:''',
              '''    def action_refresh(self) -> None:\n        self.refresh_market()\n\n    def action_toggle_timezone(self) -> None:\n        settings = getattr(self.runtime, "settings", None)\n        if settings is None:\n            self.set_status("Timezone preference is unavailable in this runtime.")\n            return\n        settings.use_local_time = not bool(getattr(settings, "use_local_time", True))\n        store = getattr(self.runtime, "settings_store", None)\n        if store is not None:\n            store.save(settings)\n        self._update_time_columns()\n        self.refresh_market()\n\n    def action_favorite_market(self) -> None:''',
              "timezone action",
          )

          text = replace_once(
              text,
              '''        for row in orderbook.get("asks", []):\n            amount = _decimal(row.get("amount", "0"))\n            asks.add_row(\n                format_amount(amount),\n                _stellar_decimal_text(_book_price(row), style="red"),\n            )\n        for row in orderbook.get("bids", []):\n            amount = _bid_base_amount(row)\n            bids.add_row(\n                _stellar_decimal_text(_book_price(row), style="green"),\n                format_amount(amount),\n            )''',
              '''        for row in orderbook.get("asks", []):\n            amount = _decimal(row.get("amount", "0"))\n            asks.add_row(\n                _stellar_decimal_text(_book_price(row), style="red"),\n                _stellar_decimal_text(amount),\n            )\n        for row in orderbook.get("bids", []):\n            amount = _bid_base_amount(row)\n            bids.add_row(\n                _stellar_decimal_text(amount),\n                _stellar_decimal_text(_book_price(row), style="green"),\n            )''',
              "orderbook mirrored rows",
          )

          text = replace_once(
              text,
              '''    def _time(self, value: str | None) -> str:\n        settings = getattr(self.runtime, "settings", None)\n        return format_timestamp(value, local=bool(getattr(settings, "use_local_time", True)))\n\n    def set_status(self, message: str) -> None:''',
              '''    def _time(self, value: str | None) -> str:\n        settings = getattr(self.runtime, "settings", None)\n        return format_timestamp(value, local=bool(getattr(settings, "use_local_time", True)))\n\n    def _time_column(self) -> str:\n        settings = getattr(self.runtime, "settings", None)\n        use_local = bool(getattr(settings, "use_local_time", True))\n        return "Time (local)" if use_local else "Time (UTC)"\n\n    def _update_time_columns(self) -> None:\n        label = self._time_column()\n        trades = self.query_one("#dex-trades", DataTable)\n        trade_columns = list(trades.columns.values())\n        if trade_columns:\n            trade_columns[-1].label = Text(label)\n            trades.refresh()\n        fills = self.query_one("#dex-fills", DataTable)\n        fill_columns = list(fills.columns.values())\n        if fill_columns:\n            fill_columns[0].label = Text(label)\n            fills.refresh()\n\n    def set_status(self, message: str) -> None:''',
              "time column helpers",
          )

          path.write_text(text)

          path = Path("reference/python/tests/test_tui_dex_market_ux.py")
          text = path.read_text()
          text = replace_once(
              text,
              '''            assert [str(column.label) for column in asks.columns.values()] == ["Amount", "Price"]\n            assert [str(column.label) for column in bids.columns.values()] == ["Price", "Amount"]\n            assert [str(column.label) for column in trades.columns.values()] == ["Price", "Amount", "Time"]''',
              '''            assert [str(column.label) for column in bids.columns.values()] == ["Amount", "Price"]\n            assert [str(column.label) for column in asks.columns.values()] == ["Price", "Amount"]\n            assert [str(column.label) for column in trades.columns.values()] == ["Price", "Amount", "Time (UTC)"]''',
              "market ux columns",
          )
          text = replace_once(
              text,
              '''            assert _plain_row(asks, 0) == ["20", "0.5100000"]\n            assert _plain_row(bids, 0) == ["0.4100000", "10"]''',
              '''            assert _plain_row(bids, 0) == ["10.0000000", "0.4100000"]\n            assert _plain_row(asks, 0) == ["0.5100000", "20.0000000"]''',
              "market ux book rows",
          )
          path.write_text(text)

          path = Path("reference/python/tests/test_tui_dex.py")
          text = path.read_text()
          text = replace_once(
              text,
              '''            assert _plain_row(asks, 0) == ["100", "0.3300000"]\n            assert _plain_row(bids, 0) == ["0.3200000", "625"]''',
              '''            assert _plain_row(bids, 0) == ["625.0000000", "0.3200000"]\n            assert _plain_row(asks, 0) == ["0.3300000", "100.0000000"]''',
              "dex projection book rows",
          )
          path.write_text(text)
          PY
      - name: Diff check
        run: git diff --check
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install Python
        working-directory: reference/python
        run: uv python install 3.11
      - name: Sync
        working-directory: reference/python
        run: uv sync --locked
      - name: Test
        working-directory: reference/python
        run: uv run pytest -q
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/fresnica/tui/dex.py reference/python/tests/test_tui_dex.py reference/python/tests/test_tui_dex_market_ux.py
          git commit -m "Polish DEX market presentation"
          git push origin HEAD:codex/dex-presentation-polish
