name: Apply Mobile security UX contract

on:
  push:
    branches:
      - refactor/mobile-security-ux-contract
    paths:
      - ".ci/mobile-security.patch.b64.*"
      - ".github/workflows/apply-mobile-security-ux-contract.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/mobile-security.patch.b64.* > /tmp/mobile-security.b64
          test "$(wc -c < /tmp/mobile-security.b64 | tr -d ' ')" = "23272"
          base64 -d /tmp/mobile-security.b64 > /tmp/mobile-security.patch.gz
          echo "742999e2f1a7db1c99def98d684297afb003c5166cd59aef3d36217eb741b14a  /tmp/mobile-security.patch.gz" | sha256sum -c -
          gzip -dc /tmp/mobile-security.patch.gz > /tmp/mobile-security.patch
          test "$(wc -c < /tmp/mobile-security.patch | tr -d ' ')" = "90260"
          echo "6af86781a7e74b320e59f7d873c9633efd53a26cfd97b179c10dadfe3238a9bf  /tmp/mobile-security.patch" | sha256sum -c -
          git apply --check /tmp/mobile-security.patch
          git apply /tmp/mobile-security.patch
          git diff --check
          node sdk/compatibility/validate.mjs
          node --test adapters/react-native/tooling/test/*.test.mjs

      - name: Commit source changes and self-clean relay
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ci/mobile-security.patch.b64.*
          rm -f .github/workflows/apply-mobile-security-ux-contract.yml
          rmdir .ci 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Mobile security UX contract"
          git push origin HEAD
