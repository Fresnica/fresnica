name: Mobile system auth

on:
  push:
    paths:
      - "bindings/mobile/platform/**"
      - "docs/mobile-system-auth.md"
      - ".github/workflows/mobile-system-auth.yml"
  pull_request:
    paths:
      - "bindings/mobile/platform/**"
      - "docs/mobile-system-auth.md"
      - ".github/workflows/mobile-system-auth.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34"
      - name: Compile Android unlock-key store
        run: |
          rm -rf /tmp/fresnica-android-auth
          mkdir -p /tmp/fresnica-android-auth
          javac \
            -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d /tmp/fresnica-android-auth \
            bindings/mobile/platform/android/src/main/java/com/fresnica/core/security/WalletUnlockKeyStore.java
          test -s /tmp/fresnica-android-auth/com/fresnica/core/security/WalletUnlockKeyStore.class

  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Type-check Apple unlock-key store for iOS 13.4+
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios13.4-simulator \
            -sdk "$SDK" \
            -typecheck \
            bindings/mobile/platform/apple/FresnicaWalletUnlockKeyStore.swift
