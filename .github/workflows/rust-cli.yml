name: Rust CLI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "clients/rust-cli/**"
      - "reference/rust-client/**"
      - "scripts/validate-rust-sdk-boundary.sh"
      - "core/rust/**"
      - "sdk/rust/**"
      - "reference/python/fresnica/storage.py"
      - "reference/python/fresnica/wallet_backup.py"
      - "reference/python/tests/test_rust_cli_compat.py"
      - ".github/workflows/rust-cli.yml"

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/validate-rust-sdk-boundary.sh
      - run: cargo test --manifest-path reference/rust-client/Cargo.toml
      - run: cargo test --manifest-path clients/rust-cli/Cargo.toml
      - run: cargo build --release --manifest-path clients/rust-cli/Cargo.toml --bin fresnica
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
        working-directory: reference/python
      - run: uv sync --locked
        working-directory: reference/python
      - run: uv run pytest -q tests/test_rust_cli_compat.py
        working-directory: reference/python
        env:
          FRESNICA_RUST_CLI_BIN: ${{ github.workspace }}/clients/rust-cli/target/release/fresnica
