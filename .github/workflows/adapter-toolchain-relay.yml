name: Adapter toolchain patch relay

on:
  pull_request:
    branches:
      - main
    paths:
      - ".ci/adapter-toolchain.patch.*"
      - ".github/workflows/adapter-toolchain-relay.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch and self-clean
        run: |
          cat .ci/adapter-toolchain.patch.* > /tmp/adapter-toolchain.patch
          git apply --check /tmp/adapter-toolchain.patch
          git apply /tmp/adapter-toolchain.patch
          rm -f .ci/adapter-toolchain.patch.*
          rmdir .ci 2>/dev/null || true
          rm -f .github/workflows/adapter-toolchain-relay.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Make React Native adapter consumer-toolchain neutral"
          git push origin HEAD:${{ github.head_ref }}
