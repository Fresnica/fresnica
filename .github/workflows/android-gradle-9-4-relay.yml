name: Android Gradle 9.4 relay

on:
  push:
    branches:
      - fix/android-gradle-9-4

permissions:
  contents: write

jobs:
  relay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci/android-gradle-9-4.patch
          git apply .ci/android-gradle-9-4.patch
          rm .ci/android-gradle-9-4.patch
          rm .github/workflows/android-gradle-9-4-relay.yml
          git diff --check
          npm test --prefix adapters/react-native
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Support Android builds on Gradle 9.4"
          git push origin HEAD:refs/heads/fix/android-gradle-9-4
