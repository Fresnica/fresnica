plugins {
    id 'com.android.library' version '7.4.0'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

android {
    namespace 'com.fresnica.core.security'
    compileSdk 34

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            java.srcDirs += [
                'src/main/java',
                'src/main/kotlin',
                '../../build/android/kotlin'
            ]
            jniLibs.srcDirs = ['../../build/android/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.12.1@aar'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.biometric:biometric:1.1.0'

    // Xaman currently hosts Fresnica in React Native 0.74.x. React itself stays a host
    // dependency and must not be embedded into the Fresnica AAR.
    compileOnly 'com.facebook.react:react-android:0.74.2'
}
