[package]
name = "fresnica-mobile-core"
version = "0.1.0"
edition = "2021"
description = "FFI-neutral mobile binding facade for Fresnica Core"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
fresnica-core = { path = "../../core/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "=0.32.0"
zeroize = "=1.9.0"

[dev-dependencies]
base64 = "=0.23.1"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]
