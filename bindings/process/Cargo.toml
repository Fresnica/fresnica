[package]
name = "fresnica-process-binding"
version = "0.1.0"
edition = "2021"
description = "Versioned stdin/stdout process binding for the Fresnica SDK"
license = "MIT"
publish = false
[[bin]]
name = "fresnica-process"
path = "src/main.rs"
[dependencies]
base64 = "=0.23.1"
fresnica-sdk = { path = "../../sdk/rust" }
serde_json = "1"
zeroize = "=1.9.0"
