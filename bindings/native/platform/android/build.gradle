plugins {
    id 'com.android.library' version '9.2.1'
}

// Preserve the Native SDK's Kotlin 1.9 consumer floor while AGP 9 uses built-in Kotlin.
kotlin {
    compilerOptions {
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
    }
}

android {
    namespace 'com.fresnica.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            kotlin.directories.add('../../build/android/kotlin')
            jniLibs.srcDirs = ['../../build/android/jniLibs']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'net.java.dev.jna:jna:5.12.1@aar'
}
