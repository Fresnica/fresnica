plugins {
    id 'com.android.application' version '9.2.1'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.fresnica.sdk.smoke'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fresnica.sdk.smoke'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

def nativeSdkAar = System.getenv('FRESNICA_NATIVE_AAR')
if (!nativeSdkAar) {
    throw new GradleException('FRESNICA_NATIVE_AAR is required')
}

dependencies {
    implementation files(nativeSdkAar)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'net.java.dev.jna:jna:5.12.1@aar'
    implementation 'androidx.annotation:annotation:1.8.2'
}
