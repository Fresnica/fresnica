[package]
name = "fresnica-wasm-sdk"
version = "0.1.0"
edition = "2021"
description = "Browser/WASM binding for the platform-neutral Fresnica SDK"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fresnica-sdk = { path = "../../sdk/rust" }
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
js-sys = "=0.3.104"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
serde_bytes = "=0.11.19"
wasm-bindgen = "=0.2.127"
