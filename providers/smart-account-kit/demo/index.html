<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresnica Passkey Testnet Smoke</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; }
    fieldset { margin: 16px 0; padding: 16px; }
    input { width: min(100%, 520px); padding: 8px; margin: 4px 0; }
    button { margin: 4px 8px 4px 0; padding: 8px 12px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h1>Fresnica Passkey Testnet Smoke</h1>
  <p>Protocol 27 Testnet only. A real WebAuthn ceremony is required.</p>
  <fieldset>
    <legend>Passkey account</legend>
    <label>User name<br><input id="user" value="fresnica-test" autocomplete="username webauthn"></label><br>
    <button id="create">Create + fund account</button>
    <button id="restore">Restore local session</button>
    <button id="discover">Authenticate + discover</button>
    <button id="disconnect">Disconnect</button>
  </fieldset>
  <fieldset>
    <legend>Signed Testnet transfer</legend>
    <label>Recipient G... or C...<br><input id="recipient" placeholder="G... or C..."></label><br>
    <label>XLM amount<br><input id="amount" type="number" value="1" min="0.0000001" step="0.0000001"></label><br>
    <button id="transfer">Sign + submit XLM transfer</button>
    <button id="download-fixture" disabled>Download verified auth fixture</button>
  </fieldset>
  <pre id="log"></pre>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
