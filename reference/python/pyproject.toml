[project]
name = "fresnica-reference"
version = "0.1.0"
description = "Python reference implementation of the Fresnica Stellar wallet runtime"
requires-python = ">=3.11"
dependencies = [
    "stellar-sdk>=15,<16",
    "cryptography>=42",
    "rich>=13",
    "textual>=8.2,<9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fresnica = "fresnica.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
