[package]
name = "fresnica-client"
version = "0.1.0"
edition = "2021"
description = "Reusable Rust Application Capability reference implementation for Fresnica"
license = "MIT"
publish = false

[dependencies]
base64 = "=0.23.1"
fresnica-core = { path = "../../core/rust" }
fresnica-sdk = { path = "../../sdk/rust" }
jsonrpsee-core = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-rpc-client = "=28.0.0-rc.1"
stellar-strkey = "=0.0.18"
stellar-xdr = "=28.0.0"
tokio = { version = "=1.52.3", features = ["time"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
toml = "=1.1.4"
sha2 = "=0.10.9"
ureq = { version = "=3.4.0", features = ["json", "multipart"] }
url = "=2.5.8"
zeroize = "=1.9.0"
