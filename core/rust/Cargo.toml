[package]
name = "fresnica-core"
version = "0.1.0"
edition = "2021"
description = "Production core primitives for the Fresnica Stellar wallet"
license = "MIT"
publish = false

[dependencies]
bip39 = "2"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
near-slip10 = "=0.4.8"
sha2 = "=0.10.9"
stellar-strkey = "=0.0.18"
stellar-xdr = "=28.0.0"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
