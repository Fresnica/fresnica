[package]
name = "fresnica-core"
version = "0.1.0"
edition = "2021"
description = "Production core primitives for the Fresnica Stellar wallet"
license = "MIT"
publish = false

[dependencies]
near-slip10 = { version = "=0.4.8", features = ["mnemonic"] }
stellar-strkey = "=0.0.18"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
